#
# Catppuccin $flavor_name for leaf
# Version: $version
# Accent: $accent_name ($accent_hex)
# Generated by scripts/generate.py from src/template.toml -- do not edit by hand.
# Tested with leaf 1.29.2
# Palette: https://catppuccin.com/palette/
#
# Direct colors are taken from the Catppuccin $flavor_name palette. Background
# tints are blended over Base (#$base):
#   search_highlight_bg    Yellow 22%
#   search_match_bg        Yellow 35%
#   status_watch_bg        Green 18%
#   status_success_bg      Green 18%
#   status_search_bg       Yellow 18%
#   status_error_bg        Red 18%
#   diff add_bg            Green 18%
#   diff del_bg            Red 18%
#   diff intra_add         Green 35%
#   diff intra_del         Red 35%
#   latex_inline_bg        $accent_name 18%
#
# leaf only loads syntect's bundled syntax themes, so $syntax is
# used for code blocks (the closest bundled match to this flavor).

base = "$base_preset"
syntax = "$syntax"

[ui]
toc_bg = "#$mantle"                      # Mantle
toc_border = "#$surface1"                # Surface 1
content_bg = "#$base"                    # Base
scrollbar_hover = "#$accent"             # $accent_name
status_bg = "#$mantle"                   # Mantle
status_separator = "#$surface2"          # Surface 2
status_brand_fg = "#$status_brand_fg"    # contrast on accent
status_brand_bg = "#$accent"             # $accent_name
status_filename_fg = "#$text"            # Text
status_filename_bg = "#$surface0"        # Surface 0
status_watch_fg = "#$status_watch_fg"    # readable Green
status_watch_bg = "#$green18"            # Green 18% over Base
status_reloaded_fg = "#$status_reloaded_fg" # contrast on Green
status_reloaded_bg = "#$green"           # Green
status_search_fg = "#$status_search_fg"  # readable Yellow
status_search_bg = "#$yellow18"          # Yellow 18% over Base
status_success_fg = "#$status_success_fg" # readable Green
status_success_bg = "#$green18"          # Green 18% over Base
status_warning_fg = "#$status_warning_fg" # readable Yellow
status_error_fg = "#$status_error_fg"    # readable Red
status_error_bg = "#$red18"              # Red 18% over Base
status_shortcut_fg = "#$overlay1"        # Overlay 1
status_percent_fg = "#$status_percent_fg" # $accent_name
status_dot_fg = "#$surface2"             # Surface 2
toc_hover_fg = "#$text"                  # Text
toc_header_fg = "#$overlay1"             # Overlay 1
toc_active_bg = "#$surface0"             # Surface 0
toc_inactive_bg = "#$mantle"             # Mantle
toc_accent = "#$toc_accent"              # $accent_name
toc_index_inactive = "#$overlay0"        # Overlay 0
toc_primary_active = "#$toc_primary_active" # $accent_name
toc_primary_inactive = "#$subtext0"      # Subtext 0
toc_secondary_inactive = "#$overlay0"    # Overlay 0
toc_secondary_text_active = "#$text"     # Text
toc_secondary_text_inactive = "#$overlay1" # Overlay 1

[markdown]
search_highlight_bg = "#$search_highlight_bg" # Yellow 22% over Base
search_match_bg = "#$search_match_bg"     # Yellow 35% over Base
code_gutter = "#$overlay0"                # Overlay 0
blockquote_marker = "#$accent"            # $accent_name
list_level_1 = "#$accent"                 # $accent_name
list_level_2 = "#$blue"                   # Blue
list_level_3 = "#$overlay2"               # Overlay 2
ordered_list = "#$ordered_list"           # readable Peach
table_border = "#$surface2"               # Surface 2
table_separator = "#$surface1"            # Surface 1
table_header = "#$table_header"           # $accent_name
table_cell = "#$text"                     # Text
heading_1 = "#$heading_1"                 # $accent_name
heading_2 = "#$blue"                      # Blue
heading_3 = "#$teal"                      # Teal
heading_4 = "#$heading_4"                 # readable Green
heading_other = "#$overlay2"              # Overlay 2
heading_underline = "#$surface2"          # Surface 2
code_frame = "#$surface2"                 # Surface 2
code_label = "#$overlay1"                 # Overlay 1
inline_code_fg = "#$inline_code_fg"       # readable Peach
inline_code_bg = "#$surface0"             # Surface 0
rule = "#$surface2"                       # Surface 2
link_icon = "#$link_icon"                 # readable Sapphire
link_text = "#$blue"                      # Blue
link_hover = "#$link_hover"               # $link_hover_name
blockquote_text = "#$subtext0"            # Subtext 0
text = "#$text"                           # Text
strong_text = "#$strong_text"             # $strong_text_name
latex_inline_fg = "#$latex_inline_fg"     # $accent_name
latex_inline_bg = "#$latex_inline_bg"     # $accent_name 18% over Base
latex_block_fg = "#$latex_block_fg"       # $accent_name
mermaid_keyword = "#$mermaid_keyword"     # $accent_name
mermaid_arrow = "#$overlay2"              # Overlay 2
mermaid_label = "#$teal"                  # Teal
mermaid_block_fg = "#$subtext0"           # Subtext 0
mark_fg = "#$mark_fg"                     # $mark_fg_name
mark_bg = "#$mark_bg"                     # $mark_bg_name
task_checked = "#$task_checked"           # readable Green
task_unchecked = "#$overlay0"             # Overlay 0
alert_note = "#$blue"                     # Blue
alert_tip = "#$alert_tip"                 # readable Green
alert_important = "#$alert_important"     # $accent_name
alert_warning = "#$alert_warning"         # readable Yellow
alert_caution = "#$red"                   # Red
footnote_ref = "#$footnote_ref"           # readable Sapphire
footnote_text = "#$subtext0"              # Subtext 0

[diff]
add_fg = "#$add_fg"                       # readable Green
add_bg = "#$green18"                      # Green 18% over Base
del_fg = "#$del_fg"                       # readable Red
del_bg = "#$red18"                        # Red 18% over Base
context_fg = "#$subtext0"                 # Subtext 0
hunk_header_fg = "#$hunk_header_fg"       # readable Peach
filename_fg = "#$blue"                    # Blue
frame_fg = "#$surface2"                   # Surface 2
tree_active = "#$tree_active"             # $accent_name
intra_add = "#$green35"                   # Green 35% over Base
intra_del = "#$red35"                     # Red 35% over Base
meta_note_fg = "#$subtext1"               # Subtext 1
