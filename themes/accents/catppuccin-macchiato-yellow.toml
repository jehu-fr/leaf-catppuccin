# Catppuccin Macchiato for leaf
# Version: 1.1.0
# Accent: Yellow (#eed49f)
# Generated by scripts/generate.py from src/template.toml -- do not edit by hand.
# Tested with leaf 1.29.2
# Palette: https://catppuccin.com/palette/
#
# Direct colors are taken from the Catppuccin Macchiato palette. Background
# tints are blended over Base (#24273a):
#   search_highlight_bg    Yellow 22%
#   search_match_bg        Yellow 35%
#   status_watch_bg        Green 18%
#   status_success_bg      Green 18%
#   status_search_bg       Yellow 18%
#   status_error_bg        Red 18%
#   diff add_bg            Green 18%
#   diff del_bg            Red 18%
#   diff intra_add         Green 35%
#   diff intra_del         Red 35%
#   latex_inline_bg        Yellow 18%
#
# leaf only loads syntect's bundled syntax themes, so base16-ocean.dark is
# used for code blocks (the closest bundled match to this flavor).

base = "ocean"
syntax = "base16-ocean.dark"

